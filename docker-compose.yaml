version: "3.9"

services:
  frontend:
    container_name: hexa-order-b2b-ui
    build:
      context: ./hexa-order-b2b-ui  # Vérifie que ce dossier existe bien
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./hexa-order-b2b-ui:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm start -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - hexa-order-b2b-network

  backend:
    container_name: hexa-order-b2b-api
    build:
      context: ./hexa-order-b2b-api  # Vérifie que ce dossier existe bien
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: hexa-order-b2b-api

      # Configuration de la base de données H2
      SPRING_DATASOURCE_URL: jdbc:h2:mem:management_db
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa

      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
    networks:
      - hexa-order-b2b-network

volumes:
  node_modules:

networks:
  hexa-order-b2b-network:
    driver: bridge
